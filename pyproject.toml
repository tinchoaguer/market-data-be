[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-be"
version = "5.5.0"
description = "Market Data backend"
authors = [{name = "Your Name", email = "your.email@example.com"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = [
    "market_data_be",
    "market_data_be.application",
    "market_data_be.application.mappers",
    "market_data_be.infrastructure",
    "market_data_be.infrastructure.http",
    "market_data_be.infrastructure.http.routes",
    "market_data_be.infrastructure.tests",
    "market_data_be.modules",
    "market_data_be.modules.analysis",
    "market_data_be.modules.analysis.analyzers",
    "market_data_be.modules.analysis.models",
    "market_data_be.modules.analysis.synthesis",
    "market_data_be.modules.analysis.tests",
    "market_data_be.modules.classification",
    "market_data_be.modules.classification.classifiers",
    "market_data_be.modules.classification.contracts",
    "market_data_be.modules.classification.models",
    "market_data_be.modules.classification.models.inputs",
]

[tool.setuptools.package-dir]
"market_data_be" = "src/market_data_be"
"market_data_be.application" = "src/application"
"market_data_be.modules" = "src/modules"
"market_data_be.infrastructure" = "src/infrastructure"

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["."]
